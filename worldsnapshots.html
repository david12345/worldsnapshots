<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldSnapshots</title>
<!-- Versão sem servidor: gerada por `npm run build:static` a partir de static/template.html. -->
<style>
:root {
  --bg: #f6f7f9; --fg: #15181d; --muted: #5d6673; --card: #fff; --line: #e2e5ea;
  --accent: #2563eb; --accent-fg: #fff; --ok: #15803d; --err: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --fg: #e8ebef; --muted: #98a2b0; --card: #181c22; --line: #29303a; --accent: #3b82f6; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--fg); }
header { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 16px; }
h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 8px; }
button { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
button.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
button:disabled { opacity: .55; cursor: progress; }
.bar { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; }
.status { color: var(--muted); font-size: 13px; }
.status .err { color: var(--err); }
.timeline { display: flex; align-items: center; gap: 8px; flex: 1 1 320px; max-width: 640px; }
.timeline input[type=range] { flex: 1; min-width: 0; }
#run-label, #m-label { font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
.live { font-size: 13px; color: var(--muted); white-space: nowrap; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform .12s; }
.card:hover { transform: translateY(-2px); }
.card .img { aspect-ratio: 16/10; background: #000; position: relative; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .badge { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
.card .meta { padding: 8px 10px; }
.card .city { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .name, .card .time { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); width: min(960px, calc(100vw - 32px)); padding: 16px; }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog h2 { margin: 0 32px 4px 0; font-size: 18px; }
dialog p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
dialog img { width: 100%; max-height: 70vh; object-fit: contain; background: #000; border-radius: 8px; display: block; margin-bottom: 10px; }
dialog .close { position: absolute; right: 12px; top: 12px; background: transparent; color: var(--fg); border: 0; font-size: 18px; }
dialog .timeline { max-width: none; }
@media (max-width: 520px) { #grid { grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; } .card .name { display: none; } }

.settings { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.settings select, .settings input, .loc input { font: inherit; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.settings input { width: 150px; }
.card.loading .img::after { content: 'a carregar…'; position: absolute; inset: 0; display: grid; place-items: center; color: #888; font-size: 12px; }
.card .img img { opacity: 0; transition: opacity .3s; }
.card .img img.ok { opacity: 1; }
.loc { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.loc form { display: flex; gap: 6px; }
.loc input[type=search] { width: 220px; padding: 6px 8px; }
.radius { display: flex; align-items: center; gap: 8px; }
.radius input { width: 160px; }
#radius-label { min-width: 56px; font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; }
.dist { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 600; }
.arrow { display: inline-block; transition: transform .2s; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
.chips button { padding: 4px 10px; font-size: 13px; }
.empty b { color: var(--fg); }
dialog a { color: var(--accent); }
</style>
</head>

<header>
  <div class="brand">
    <h1>WorldSnapshots</h1>
    <p>Câmaras públicas perto de ti</p>
  </div>
  <div class="loc">

    <form id="form-search">

      <button class="ghost" type="submit">Ir</button>
    </form>

</header>

<section class="bar">
  <div class="status" id="status">A obter a localização…</div>
  <div class="settings">
    <label class="radius">Raio
      <input id="inp-radius" type="range" min="0" max="14" step="1" aria-label="Raio de pesquisa">
      <span id="radius-label"></span>
    </label>
    <label>Máx.
      <select id="sel-count"><option>12</option><option>24</option><option>50</option><option>100</option></select>
    </label>

      <select id="sel-interval">
        <option value="1">1 min</option><option value="5">5 min</option><option value="15">15 min</option>
        <option value="30">30 min</option><option value="60">1 h</option><option value="0">nunca</option>
      </select>
    </label>
    <button id="btn-sync" class="ghost" title="Recarregar as imagens agora">⟳</button>
    <label title="Chave gratuita em api.windy.com/keys — webcams em todo o mundo, incluindo Portugal">Windy
      <input id="inp-windy" type="password" placeholder="chave (opcional)" autocomplete="off">
    </label>
  </div>
</section>

<main id="grid" aria-live="polite"></main>
<div id="empty" class="empty" hidden></div>

<dialog id="modal">
  <form method="dialog"><button class="close" aria-label="Fechar">✕</button></form>
  <h2 id="m-title"></h2>
  <p id="m-sub"></p>
  <img id="m-img" alt="">
</dialog>

<script id="embedded-catalog" type="application/json">null</script>
<script>
'use strict';
// ---- Código partilhado com a versão Node (embutido na build) ----
// Normaliza as câmaras de uma fonte para o formato do catálogo.
// Módulo puro (sem Node): também é embutido na versão HTML sem servidor.
const isHttp = (u) => typeof u === 'string' && /^https?:\/\//i.test(u);

function normalize(provider, raw) {
  return raw
    .filter((c) => c && c.rawId != null && isHttp(c.imageUrl))
    .map((c) => ({
      id: `${provider.id}:${c.rawId}`,
      provider: provider.id,
      providerName: provider.name,
      group: c.group || provider.id,
      name: String(c.name ?? c.rawId).trim(),
      city: c.city || provider.city || '',
      country: c.country || provider.country || '',
      lat: Number.isFinite(c.lat) ? c.lat : null,
      lon: Number.isFinite(c.lon) ? c.lon : null,
      imageUrl: c.imageUrl,
      ...(c.headers ? { headers: c.headers } : {}),
    }));
}


// Seleção de câmaras: mantém as mesmas câmaras entre sincronizações (para se
// poder comparar ao longo do tempo) e distribui-as por várias fontes/cidades.

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * Devolve TODAS as câmaras do catálogo ordenadas por prioridade:
 *  1. as da seleção anterior (ainda existentes), pela mesma ordem;
 *  2. as restantes em round-robin entre grupos, respeitando maxPerGroup;
 *  3. o resto (para substituir câmaras que falhem).
 * Quem chama usa as primeiras N que funcionarem.
 */
function rankCandidates(cameras, { previousIds = [], maxPerGroup = 8, rng = Math.random } = {}) {
  const byId = new Map(cameras.map((c) => [c.id, c]));
  const used = new Set();
  const counts = new Map();
  const out = [];
  const take = (c) => {
    used.add(c.id);
    counts.set(c.group, (counts.get(c.group) || 0) + 1);
    out.push(c);
  };

  for (const id of previousIds) {
    const c = byId.get(id);
    if (c && !used.has(id)) take(c);
  }

  const groups = new Map();
  for (const c of shuffle(cameras, rng)) {
    if (used.has(c.id)) continue;
    if (!groups.has(c.group)) groups.set(c.group, []);
    groups.get(c.group).push(c);
  }
  const queues = shuffle([...groups.values()], rng);

  const overflow = [];
  let progressed = true;
  while (progressed) {
    progressed = false;
    for (const q of queues) {
      const c = q.shift();
      if (!c) continue;
      progressed = true;
      if ((counts.get(c.group) || 0) < maxPerGroup) take(c);
      else overflow.push(c);
    }
  }
  for (const c of overflow) take(c);
  return out;
}


// Geometria simples (módulo puro: também embutido na versão sem servidor).
const R_EARTH_KM = 6371.0088;
const rad = (d) => (d * Math.PI) / 180;

/** Distância em km entre dois pontos (fórmula de haversine). */
function distanceKm(lat1, lon1, lat2, lon2) {
  const dLat = rad(lat2 - lat1);
  const dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R_EARTH_KM * Math.asin(Math.min(1, Math.sqrt(a)));
}

/** Rumo inicial em graus (0 = norte, 90 = este). */
function bearingDeg(lat1, lon1, lat2, lon2) {
  const y = Math.sin(rad(lon2 - lon1)) * Math.cos(rad(lat2));
  const x = Math.cos(rad(lat1)) * Math.sin(rad(lat2)) - Math.sin(rad(lat1)) * Math.cos(rad(lat2)) * Math.cos(rad(lon2 - lon1));
  return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
}

function compass(deg) {
  return ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][Math.round(deg / 45) % 8];
}

/** Distância (km) de um ponto ao retângulo [minLat, minLon, maxLat, maxLon]; 0 se estiver dentro. */
function distanceToBboxKm(lat, lon, bbox) {
  const [minLat, minLon, maxLat, maxLon] = bbox;
  const cLat = Math.min(Math.max(lat, minLat), maxLat);
  const cLon = Math.min(Math.max(lon, minLon), maxLon);
  return distanceKm(lat, lon, cLat, cLon);
}

/** Uma fonte cobre a zona se não tiver bbox (global) ou se o círculo tocar na bbox. */
function providerCovers(provider, lat, lon, radiusKm) {
  return !provider.bbox || distanceToBboxKm(lat, lon, provider.bbox) <= radiusKm;
}

/** Câmaras dentro do raio, ordenadas pela distância (acrescenta distanceKm e bearing). */
function camerasNear(cameras, lat, lon, radiusKm) {
  const out = [];
  for (const c of cameras) {
    if (c.lat == null || c.lon == null) continue;
    const d = distanceKm(lat, lon, c.lat, c.lon);
    if (d <= radiusKm) out.push({ ...c, distanceKm: d, bearing: bearingDeg(lat, lon, c.lat, c.lon) });
  }
  return out.sort((a, b) => a.distanceKm - b.distanceKm);
}

/** A câmara mais próxima (fora do raio), para sugerir até onde aumentar. */
function nearestCamera(cameras, lat, lon) {
  let best = null;
  for (const c of cameras) {
    if (c.lat == null || c.lon == null) continue;
    const d = distanceKm(lat, lon, c.lat, c.lon);
    if (!best || d < best.distanceKm) best = { ...c, distanceKm: d };
  }
  return best;
}


const __P_tfl = (() => {
// Transport for London — JamCams (Londres, Reino Unido). Público, sem chave.
// https://api.tfl.gov.uk/Place/Type/JamCam
return {
  id: 'tfl',
  name: 'Transport for London JamCams',
  city: 'Londres',
  country: 'GB',
  /** Zona coberta [minLat, minLon, maxLat, maxLon] — usada na pesquisa por localização. */
  bbox: [51.25, -0.55, 51.72, 0.33],
  async discover({ getJson }) {
    const data = await getJson('https://api.tfl.gov.uk/Place/Type/JamCam');
    return data.flatMap((p) => {
      const props = Object.fromEntries((p.additionalProperties || []).map((a) => [a.key, a.value]));
      if (!props.imageUrl || props.available === 'false') return [];
      return [{
        rawId: p.id,
        name: p.commonName,
        city: 'Londres',
        country: 'GB',
        lat: p.lat,
        lon: p.lon,
        imageUrl: props.imageUrl,
      }];
    });
  },
};

})();

const __P_singapore = (() => {
// Singapura — LTA Traffic Images via data.gov.sg. Público, sem chave.
// Os URLs das imagens são temporários (assinados), por isso a fonte é "volátil":
// é redescoberta em cada sincronização.
return {
  id: 'singapore',
  name: 'Singapore LTA Traffic Images',
  city: 'Singapura',
  country: 'SG',
  /** Zona coberta [minLat, minLon, maxLat, maxLon] — usada na pesquisa por localização. */
  bbox: [1.15, 103.6, 1.48, 104.1],
  volatile: true,
  async discover({ getJson }) {
    const data = await getJson('https://api.data.gov.sg/v1/transport/traffic-images');
    const cams = data?.items?.[0]?.cameras || [];
    return cams.map((c) => ({
      rawId: c.camera_id,
      name: `Câmara ${c.camera_id}`,
      city: 'Singapura',
      country: 'SG',
      lat: c.location?.latitude,
      lon: c.location?.longitude,
      imageUrl: c.image,
    }));
  },
};

})();

const __P_nyc = (() => {
// Nova Iorque — NYC DOT Traffic Management Center. Público, sem chave.
// https://webcams.nyctmc.org/api/cameras
return {
  id: 'nyc',
  name: 'NYC DOT Traffic Cameras',
  city: 'Nova Iorque',
  country: 'US',
  /** Zona coberta [minLat, minLon, maxLat, maxLon] — usada na pesquisa por localização. */
  bbox: [40.48, -74.27, 40.93, -73.68],
  async discover({ getJson }) {
    const data = await getJson('https://webcams.nyctmc.org/api/cameras');
    return data
      .filter((c) => String(c.isOnline) !== 'false')
      .map((c) => ({
        rawId: c.id,
        name: c.name,
        city: 'Nova Iorque',
        country: 'US',
        lat: Number(c.latitude),
        lon: Number(c.longitude),
        imageUrl: c.imageUrl || `https://webcams.nyctmc.org/api/cameras/${c.id}/image`,
      }));
  },
};

})();

const __P_digitraffic = (() => {
// Finlândia — Digitraffic weather cameras (Fintraffic). Público, sem chave.
// https://tie.digitraffic.fi/api/weathercam/v1/stations
const HEADERS = { 'Digitraffic-User': 'worldsnapshots' };

return {
  id: 'digitraffic',
  name: 'Digitraffic Weather Cameras',
  city: 'Finlândia',
  country: 'FI',
  /** Zona coberta [minLat, minLon, maxLat, maxLon] — usada na pesquisa por localização. */
  bbox: [59.6, 19.4, 70.1, 31.6],
  async discover({ getJson }) {
    const data = await getJson('https://tie.digitraffic.fi/api/weathercam/v1/stations', { headers: HEADERS });
    return (data.features || []).flatMap((f) => {
      const p = f.properties || {};
      if (p.collectionStatus && p.collectionStatus !== 'GATHERING') return [];
      const preset = (p.presets || []).find((x) => x.inCollection !== false);
      if (!preset) return [];
      const [lon, lat] = f.geometry?.coordinates || [];
      return [{
        rawId: preset.id,
        name: p.name,
        city: p.name?.split('_')[0] || 'Finlândia',
        country: 'FI',
        lat,
        lon,
        imageUrl: `https://weathercam.digitraffic.fi/${preset.id}.jpg`,
        headers: HEADERS,
      }];
    });
  },
};

})();

const __P_caltrans = (() => {
// Califórnia — Caltrans CCTV (um ficheiro JSON por distrito). Público, sem chave.
// https://cwwp2.dot.ca.gov/data/d7/cctv/cctvStatusD07.json
const DISTRICTS = [
  { d: 4, city: 'São Francisco (Bay Area)' },
  { d: 7, city: 'Los Angeles' },
  { d: 11, city: 'San Diego' },
  { d: 3, city: 'Sacramento' },
];

return {
  id: 'caltrans',
  name: 'Caltrans CCTV',
  city: 'Califórnia',
  country: 'US',
  /** Zona coberta [minLat, minLon, maxLat, maxLon] — usada na pesquisa por localização. */
  bbox: [32.5, -124.5, 42.1, -114.1],
  async discover({ getJson }) {
    const results = await Promise.allSettled(DISTRICTS.map(async ({ d, city }) => {
      const dd = String(d).padStart(2, '0');
      const data = await getJson(`https://cwwp2.dot.ca.gov/data/d${d}/cctv/cctvStatusD${dd}.json`);
      return (data.data || []).flatMap(({ cctv }) => {
        const url = cctv?.imageData?.static?.currentImageURL;
        if (!url || cctv.inService === 'false') return [];
        const loc = cctv.location || {};
        return [{
          rawId: `d${d}-${cctv.index}`,
          name: loc.locationName || `CCTV ${cctv.index}`,
          city: loc.nearbyPlace ? `${loc.nearbyPlace}, CA` : city,
          country: 'US',
          lat: Number(loc.latitude),
          lon: Number(loc.longitude),
          imageUrl: url,
        }];
      });
    }));
    const ok = results.filter((r) => r.status === 'fulfilled').flatMap((r) => r.value);
    if (!ok.length && results.length) throw results.find((r) => r.status === 'rejected').reason;
    return ok;
  },
};

})();

const __P_hongkong = (() => {
// Hong Kong — Transport Department traffic snapshots. Público, sem chave.
// Lista de localizações em XML; imagens em https://tdcctv.data.one.gov.hk/<key>.JPG
const LIST = 'https://static.data.gov.hk/td/traffic-snapshot-images/code/Traffic_Camera_Locations_En.xml';

const tag = (xml, name) => {
  const m = xml.match(new RegExp(`<${name}>([\\s\\S]*?)</${name}>`));
  return m ? m[1].replace(/<!\[CDATA\[|\]\]>/g, '').trim() : undefined;
};

return {
  id: 'hongkong',
  name: 'Hong Kong Transport Department',
  city: 'Hong Kong',
  country: 'HK',
  /** Zona coberta [minLat, minLon, maxLat, maxLon] — usada na pesquisa por localização. */
  bbox: [22.13, 113.82, 22.57, 114.44],
  async discover({ getText }) {
    const xml = await getText(LIST);
    const blocks = xml.match(/<image>[\s\S]*?<\/image>/g) || [];
    return blocks.flatMap((b) => {
      const key = tag(b, 'key');
      if (!key) return [];
      return [{
        rawId: key,
        name: tag(b, 'description') || key,
        city: tag(b, 'district') ? `${tag(b, 'district')}, Hong Kong` : 'Hong Kong',
        country: 'HK',
        lat: Number(tag(b, 'latitude')),
        lon: Number(tag(b, 'longitude')),
        imageUrl: tag(b, 'url') || `https://tdcctv.data.one.gov.hk/${key}.JPG`,
      }];
    });
  },
};

})();

const __P_ontario = (() => {
// Ontário — 511ON (Toronto, Ottawa, …). Público, sem chave.
// https://511on.ca/api/v2/get/cameras
return {
  id: 'ontario',
  name: 'Ontario 511 Cameras',
  city: 'Ontário',
  country: 'CA',
  /** Zona coberta [minLat, minLon, maxLat, maxLon] — usada na pesquisa por localização. */
  bbox: [41.6, -95.2, 56.9, -74.3],
  async discover({ getJson }) {
    const data = await getJson('https://511on.ca/api/v2/get/cameras?format=json');
    return data.flatMap((c) => {
      // A API já teve dois formatos: campo Url direto, ou lista Views[].
      const views = c.Views?.length ? c.Views : [{ Id: 0, Url: c.Url, Status: c.Status }];
      return views
        .filter((v) => v.Url && !/disabled/i.test(v.Status || ''))
        .map((v) => ({
          rawId: `${c.Id}-${v.Id ?? 0}`,
          name: [c.Roadway, c.Location || c.Name].filter(Boolean).join(' — ') || `Câmara ${c.Id}`,
          city: c.Organization || c.Source || 'Ontário',
          country: 'CA',
          lat: Number(c.Latitude),
          lon: Number(c.Longitude),
          imageUrl: v.Url,
        }));
    });
  },
};

})();

const __P_windy = (() => {
// Windy Webcams API v3 — dezenas de milhares de webcams em todo o mundo.
// Requer chave gratuita: https://api.windy.com/keys  →  WINDY_API_KEY=...
// Os URLs de imagem expiram, por isso a fonte é "volátil".
return {
  id: 'windy',
  name: 'Windy Webcams (mundo)',
  city: 'Mundo',
  country: '—',
  volatile: true,
  enabled: (config) => Boolean(config.windyApiKey),
  async discover({ getJson, config, near }) {
    const headers = { 'x-windy-api-key': config.windyApiKey };
    // Com localização (versão sem servidor): webcams num raio (a API aceita até 250 km).
    // Sem localização (servidor): as mais populares do mundo.
    const base = 'https://api.windy.com/webcams/api/v3/webcams?limit=50&include=images,location';
    const query = near
      ? `&nearby=${near.lat.toFixed(4)},${near.lon.toFixed(4)},${Math.min(250, Math.max(1, Math.round(near.radiusKm)))}`
      : '&sortKey=popularity&sortDirection=desc';
    const offsets = near ? [0, 50] : [0, 50, 100, 150];
    const pages = offsets.map(async (offset) => {
      const data = await getJson(`${base}${query}&offset=${offset}`, { headers });
      return data.webcams || [];
    });
    const all = (await Promise.all(pages)).flat();
    return all
      .filter((w) => w.status === undefined || w.status === 'active')
      .flatMap((w) => {
        const img = w.images?.current?.preview || w.images?.current?.thumbnail;
        if (!img) return [];
        return [{
          rawId: w.webcamId,
          name: w.title,
          city: w.location?.city || w.location?.region || 'Desconhecido',
          country: w.location?.country_code || w.location?.country || '—',
          lat: w.location?.latitude,
          lon: w.location?.longitude,
          imageUrl: img,
          // Fonte independente por país para efeitos de diversidade na seleção.
          group: `windy:${w.location?.country_code || w.location?.country || '?'}`,
        }];
      });
  },
};

})();

const PROVIDERS = [__P_tfl, __P_singapore, __P_nyc, __P_digitraffic, __P_caltrans, __P_hongkong, __P_ontario, __P_windy];

// ---- Aplicação: câmaras mais próximas da localização do utilizador ----
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('ws:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('ws:' + k, JSON.stringify(v)); } catch { /* sem storage */ } },
  };

  const RADII = [0.5, 1, 2, 3, 5, 10, 15, 20, 30, 50, 75, 100, 150, 200, 250];
  const PLACES = [
    ['Londres', 51.5074, -0.1278], ['Nova Iorque', 40.758, -73.9855], ['Singapura', 1.3521, 103.8198],
    ['Hong Kong', 22.3193, 114.1694], ['Helsínquia', 60.1699, 24.9384], ['Los Angeles', 34.0522, -118.2437],
    ['São Francisco', 37.7749, -122.4194], ['Toronto', 43.6532, -79.3832],
  ];

  const settings = {
    radiusIdx: store.get('radiusIdx', 5),
    count: store.get('count', 50),
    interval: store.get('interval', 5),
    windyApiKey: store.get('windy', ''),
  };
  const radiusKm = () => RADII[settings.radiusIdx];

  const embedded = (() => {
    try { return JSON.parse($('#embedded-catalog').textContent) || null; } catch { return null; }
  })();

  const state = {
    loc: store.get('loc', null), // { lat, lon, label, accuracy }
    cameras: new Map(),
    status: {},                  // por fonte: { ok, count, live, error }
    loaded: new Set(),           // fontes já consultadas ao vivo
    shown: [], queue: [], failed: new Set(),
    lastSync: null, nextSync: null, timer: null, busy: false,
  };

  const flag = (cc) => (/^[A-Z]{2}$/i.test(cc || '')
    ? String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 0x1f1a5 + c.charCodeAt(0))) : '🌐');
  const fmtTime = (d) => d.toLocaleTimeString('pt-PT');
  const fmtKm = (km) => (km < 1 ? Math.round(km * 1000) + ' m'
    : km.toLocaleString('pt-PT', { maximumFractionDigits: km < 10 ? 1 : 0 }) + ' km');
  const pageIsHttps = location.protocol === 'https:';

  // ---- HTTP no browser (sujeito a CORS) ----
  async function req(url, { headers = {} } = {}) {
    const res = await fetch(url, { headers, signal: AbortSignal.timeout(15000) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res;
  }
  const http = {
    getJson: async (u, o) => (await req(u, o)).json(),
    getText: async (u, o) => (await req(u, o)).text(),
  };
  const providerConfig = () => ({ windyApiKey: settings.windyApiKey });
  const activeProviders = () => PROVIDERS.filter((p) => (p.enabled ? p.enabled(providerConfig()) : true));
  const coveringProviders = () => activeProviders().filter((p) => providerCovers(p, state.loc.lat, state.loc.lon, radiusKm()));

  function setProviderCams(p, cams, info) {
    for (const [id, c] of state.cameras) if (c.provider === p.id) state.cameras.delete(id);
    for (const c of cams) {
      if (pageIsHttps && c.imageUrl.startsWith('http:')) continue; // conteúdo misto bloqueado
      delete c.headers;
      state.cameras.set(c.id, c);
    }
    state.status[p.id] = { name: p.name, ...info };
  }

  async function discoverLive(p) {
    const near = { lat: state.loc.lat, lon: state.loc.lon, radiusKm: radiusKm() };
    try {
      const cams = normalize(p, await p.discover({ ...http, config: providerConfig(), near }));
      setProviderCams(p, cams, { ok: true, count: cams.length, live: true });
    } catch (e) {
      const prev = state.status[p.id];
      // Sem acesso direto (normalmente CORS): fica com o catálogo embutido, se existir.
      state.status[p.id] = prev?.count
        ? { ...prev, live: false, error: e.message }
        : { name: p.name, ok: false, count: 0, error: e.message };
    }
    state.loaded.add(p.id);
  }

  if (embedded?.cameras?.length) {
    for (const p of PROVIDERS) {
      const cams = embedded.cameras.filter((c) => c.provider === p.id);
      if (cams.length) setProviderCams(p, cams, { ok: true, count: cams.length, live: false });
    }
  }

  // ---- Carregar a zona: só consulta as fontes que cobrem o círculo ----
  let areaSeq = 0;
  async function loadArea() {
    if (!state.loc) return;
    const seq = ++areaSeq;
    state.busy = true;
    renderStatus();
    // Fontes "por raio" (Windy) dependem do sítio; as outras só se consultam uma vez.
    await Promise.all(coveringProviders()
      .filter((p) => p.volatile || !state.loaded.has(p.id))
      .map(discoverLive));
    if (seq !== areaSeq) return; // entretanto mudou o local/raio
    state.busy = false;
    state.lastSync = new Date();
    render();
    schedule();
  }

  // ---- Grelha ----
  function render() {
    const near = camerasNear([...state.cameras.values()], state.loc.lat, state.loc.lon, radiusKm())
      .filter((c) => !state.failed.has(c.id));
    state.shown = near.slice(0, settings.count);
    state.queue = near.slice(settings.count);
    const t = Date.now();
    $('#grid').replaceChildren(...state.shown.map((c) => makeCard(c, t)));
    renderEmpty();
    renderStatus();
  }

  const withBuster = (c, t) => {
    const p = PROVIDERS.find((x) => x.id === c.provider);
    if (p?.volatile) return c.imageUrl; // URLs assinados: não se podem alterar
    return c.imageUrl + (c.imageUrl.includes('?') ? '&' : '?') + '_ws=' + t;
  };

  function makeCard(cam, t) {
    const el = document.createElement('article');
    el.className = 'card loading';
    el.innerHTML = '<div class="img"><img alt="" referrerpolicy="no-referrer"><span class="badge"></span></div>' +
      '<div class="meta"><div class="city"><span class="dist"><span class="arrow">↑</span><span class="km"></span></span> <span class="place"></span></div>' +
      '<div class="name"></div><div class="time"></div></div>';
    el.addEventListener('click', () => openCamera(el._cam, el.querySelector('img').src));
    const img = el.querySelector('img');
    img.addEventListener('load', () => {
      // Imagens minúsculas costumam ser "câmara indisponível".
      if (img.naturalWidth < 120 || img.naturalHeight < 80) return img.dispatchEvent(new Event('error'));
      el.classList.remove('loading');
      img.classList.add('ok');
      el.querySelector('.time').textContent = 'atualizado ' + fmtTime(new Date());
    });
    img.addEventListener('error', () => {
      state.failed.add(el._cam.id);
      const repl = state.queue.shift(); // a seguinte mais próxima
      const i = state.shown.findIndex((c) => c.id === el._cam.id);
      if (!repl) { if (i >= 0) state.shown.splice(i, 1); el.remove(); renderEmpty(); renderStatus(); return; }
      if (i >= 0) state.shown[i] = repl;
      fillCard(el, repl, Date.now());
    });
    fillCard(el, cam, t);
    return el;
  }

  function fillCard(el, cam, t) {
    el._cam = cam;
    el.dataset.id = cam.id;
    el.classList.add('loading');
    const img = el.querySelector('img');
    img.classList.remove('ok');
    img.alt = cam.name + ' — ' + cam.city;
    el.querySelector('.badge').textContent = cam.providerName || cam.provider;
    el.querySelector('.arrow').style.transform = 'rotate(' + Math.round(cam.bearing) + 'deg)';
    el.querySelector('.km').textContent = fmtKm(cam.distanceKm) + ' ' + compass(cam.bearing);
    el.querySelector('.place').textContent = '· ' + flag(cam.country) + ' ' + cam.city;
    el.querySelector('.name').textContent = cam.name;
    el.querySelector('.time').textContent = '';
    img.src = withBuster(cam, t);
  }

  function chips() {
    return '<div class="chips">' + PLACES.map(([n], i) =>
      '<button class="ghost" data-place="' + i + '">' + n + '</button>').join('') + '</div>';
  }

  function renderEmpty() {
    const box = $('#empty');
    if (state.shown.length || state.busy) { box.hidden = true; return; }
    box.hidden = false;
    if (!state.loc) {
      box.innerHTML = '<b>Onde estás?</b><br>Carrega em 📍 <b>A minha localização</b> ou procura uma cidade.' +
        '<br>Ou experimenta uma cidade com câmaras públicas:' + chips();
      return;
    }
    const r = radiusKm();
    const nearest = nearestCamera([...state.cameras.values()].filter((c) => !state.failed.has(c.id)), state.loc.lat, state.loc.lon);
    let msg = 'Não há câmaras a menos de <b>' + fmtKm(r) + '</b> de ' + escapeHtml(state.loc.label || 'ti') + '.';
    if (nearest && nearest.distanceKm <= RADII.at(-1)) {
      const idx = RADII.findIndex((x) => x >= nearest.distanceKm);
      msg += '<br>A mais próxima está a <b>' + fmtKm(nearest.distanceKm) + '</b> (' + escapeHtml(nearest.city) + ').' +
        '<div class="chips"><button data-radius="' + idx + '">Aumentar o raio para ' + fmtKm(RADII[idx]) + '</button></div>';
    } else {
      const zones = activeProviders().filter((p) => p.bbox)
        .map((p) => ({ p, d: distanceToBboxKm(state.loc.lat, state.loc.lon, p.bbox) }))
        .sort((a, b) => a.d - b.d);
      if (zones.length) msg += '<br>A zona com câmaras públicas sem chave mais próxima é <b>' + escapeHtml(zones[0].p.city) +
        '</b>, a ' + fmtKm(zones[0].d) + '.';
      if (!settings.windyApiKey) {
        msg += '<br><br>Para câmaras <b>em qualquer parte do mundo</b> (incluindo Portugal), cria uma chave gratuita em ' +
          '<a href="https://api.windy.com/keys" target="_blank" rel="noopener">api.windy.com/keys</a> e cola-a no campo <b>Windy</b> acima.';
      }
      msg += '<br><br>Ou experimenta:' + chips();
    }
    box.innerHTML = msg;
  }

  const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';');

  $('#empty').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.place) { const [n, lat, lon] = PLACES[b.dataset.place]; setLocation({ lat, lon, label: n }); }
    if (b.dataset.radius) setRadius(Number(b.dataset.radius));
  });

  // ---- Sincronização periódica ----
  async function sync() {
    if (!state.loc || state.busy) return;
    $('#btn-sync').disabled = true;
    // Fontes com URLs temporários têm de ser redescobertas para obter imagens novas.
    await Promise.all(coveringProviders().filter((p) => p.volatile).map(discoverLive));
    const t = Date.now();
    for (const el of $('#grid').children) {
      const fresh = state.cameras.get(el._cam.id);
      if (fresh) el._cam = { ...el._cam, imageUrl: fresh.imageUrl };
      el.querySelector('img').src = withBuster(el._cam, t);
    }
    state.lastSync = new Date();
    $('#btn-sync').disabled = false;
    schedule();
  }

  function schedule() {
    clearTimeout(state.timer);
    state.nextSync = settings.interval > 0 ? Date.now() + settings.interval * 60000 : null;
    if (state.nextSync) state.timer = setTimeout(sync, settings.interval * 60000);
    renderStatus();
  }

  function renderStatus() {
    const parts = [];
    if (state.loc) {
      parts.push('📍 ' + (state.loc.label || state.loc.lat.toFixed(4) + ', ' + state.loc.lon.toFixed(4)) +
        (state.loc.accuracy ? ' (±' + fmtKm(state.loc.accuracy / 1000) + ')' : ''));
    }
    if (state.busy) parts.push('a procurar câmaras…');
    else if (state.loc) {
      const covering = coveringProviders().filter((p) => state.status[p.id]?.ok).length;
      const total = state.shown.length + state.queue.length;
      parts.push(total + (total === 1 ? ' câmara' : ' câmaras') + ' até ' + fmtKm(radiusKm()) +
        (state.queue.length ? ' (' + state.shown.length + ' visíveis)' : ''));
      parts.push(covering + ' fonte' + (covering === 1 ? '' : 's') + ' nesta zona');
      if (state.lastSync) parts.push('atualizado às ' + fmtTime(state.lastSync));
      if (state.nextSync) {
        const s = Math.max(0, Math.round((state.nextSync - Date.now()) / 1000));
        parts.push('próximo em ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'));
      }
    }
    $('#status').textContent = parts.join(' · ') || 'Escolhe um local.';
    $('#status').title = Object.entries(state.status).map(([id, s]) =>
      (s.ok ? '✓ ' : '✗ ') + (s.name || id) + ': ' +
      (s.ok ? s.count + ' câmaras' + (s.live ? ' (ao vivo)' : ' (catálogo embutido)') : s.error)).join('\n');
  }

  function openCamera(c, src) {
    $('#m-title').textContent = flag(c.country) + ' ' + c.city + ' — ' + c.name;
    const sub = $('#m-sub');
    sub.textContent = fmtKm(c.distanceKm) + ' para ' + compass(c.bearing) + ' · ' + c.providerName + ' ';
    const a = document.createElement('a');
    a.href = 'https://www.openstreetmap.org/directions?route=' + state.loc.lat + '%2C' + state.loc.lon + '%3B' + c.lat + '%2C' + c.lon;
    a.target = '_blank'; a.rel = 'noopener';
    a.textContent = '· ver no mapa';
    sub.append(a);
    $('#m-img').src = src;
    $('#modal').showModal();
  }

  // ---- Localização ----
  function setLocation(loc) {
    state.loc = loc;
    store.set('loc', loc);
    state.failed.clear();
    loadArea();
  }

  function locate() {
    if (!navigator.geolocation) { $('#status').textContent = 'Este browser não dá a localização — procura um local.'; return; }
    $('#status').textContent = 'A pedir a localização ao browser…';
    navigator.geolocation.getCurrentPosition(
      (pos) => setLocation({ lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy, label: 'a tua localização' }),
      (err) => {
        $('#status').textContent = (err.code === 1 ? 'Localização recusada' : 'Não foi possível obter a localização') +
          ' — procura uma cidade ou escreve "lat, lon".';
        if (!state.loc) renderEmpty();
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }

  async function search(q) {
    const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (m) return setLocation({ lat: Number(m[1]), lon: Number(m[2]), label: q.trim() });
    $('#status').textContent = 'A procurar "' + q + '"…';
    try {
      // Geocodificação pelo OpenStreetMap (Nominatim).
      const res = await http.getJson('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=pt&q=' + encodeURIComponent(q));
      if (!res.length) { $('#status').textContent = 'Não encontrei "' + q + '".'; return; }
      setLocation({ lat: Number(res[0].lat), lon: Number(res[0].lon), label: res[0].display_name.split(',').slice(0, 2).join(',') });
    } catch (e) {
      $('#status').textContent = 'A pesquisa de locais falhou (' + e.message + '). Escreve as coordenadas: "38.72, -9.14".';
    }
  }

  // ---- Controlos ----
  let radiusTimer;
  function setRadius(idx) {
    settings.radiusIdx = idx;
    store.set('radiusIdx', idx);
    $('#inp-radius').value = idx;
    $('#radius-label').textContent = fmtKm(radiusKm());
    clearTimeout(radiusTimer);
    radiusTimer = setTimeout(() => { if (state.loc) { state.failed.clear(); loadArea(); } }, 400);
  }

  $('#inp-radius').value = settings.radiusIdx;
  $('#radius-label').textContent = fmtKm(radiusKm());
  $('#sel-count').value = String(settings.count);
  $('#sel-interval').value = String(settings.interval);
  $('#inp-windy').value = settings.windyApiKey;

  $('#inp-radius').oninput = (e) => setRadius(Number(e.target.value));
  $('#sel-count').onchange = (e) => { settings.count = Number(e.target.value); store.set('count', settings.count); if (state.loc) render(); };
  $('#sel-interval').onchange = (e) => { settings.interval = Number(e.target.value); store.set('interval', settings.interval); schedule(); };
  $('#inp-windy').onchange = (e) => {
    settings.windyApiKey = e.target.value.trim();
    store.set('windy', settings.windyApiKey);
    if (!settings.windyApiKey) setProviderCams(PROVIDERS.find((p) => p.id === 'windy'), [], { ok: false, count: 0, error: 'sem chave' });
    loadArea();
  };
  $('#btn-locate').onclick = locate;
  $('#form-search').onsubmit = (e) => { e.preventDefault(); const q = $('#inp-search').value.trim(); if (q) search(q); };
  $('#btn-sync').onclick = () => sync();
  setInterval(renderStatus, 1000);

  if (state.loc) loadArea(); // último local usado
  else { renderEmpty(); locate(); }
})();
</script>
